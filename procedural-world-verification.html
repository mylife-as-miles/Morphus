<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dream Studio Procedural World Verification</title>
    <style>
      html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #090d0d; }
      canvas { display: block; }
      #status { position: fixed; inset: 0; display: grid; place-items: center; color: #d9e3dd; font: 13px system-ui, sans-serif; background: #090d0d; }
      #status[data-ready="true"] { display: none; }
      #failure { max-width: 720px; padding: 24px; white-space: pre-wrap; color: #ffb4ab; }
    </style>
  </head>
  <body>
    <canvas id="world"></canvas>
    <div id="status"><div id="failure">Preparing WebGPU</div></div>
    <script type="module" src="/src/procedural-world-verification.ts"></script>
  </body>
</html>
